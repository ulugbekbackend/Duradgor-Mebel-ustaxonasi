# Duradgor Mebel — production (HTTPS) varianti.
# Ishlatish: docker-compose.yml da nginx volume'ini shu faylga almashtiring, "443:443" portini oching
# va sertifikatlarni ulang, masalan:
#   - /etc/letsencrypt:/etc/letsencrypt:ro     (certbot bilan olingan)
# backend/.env: DEBUG=False, SECURE_SSL_REDIRECT=True, ALLOWED_HOSTS=example.com,www.example.com
upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# HTTP → HTTPS (certbot webroot tekshiruvi bundan mustasno)
server {
    listen 80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/   { proxy_pass http://backend; }
    location /admin/ { proxy_pass http://backend; }

    location /static/ {
        alias /vol/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /vol/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / { proxy_pass http://frontend; }
}
